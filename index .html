<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Ruota Maledetta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap">
<style>
:root{color-scheme:dark;--bg:#14101c;--panel:#1f1830;--ink:#f1e7d0;--muted:#a79bbd;--pumpkin:#ff7a1a;--P:#d35400;--O:#8e44ad;--R:#1e9a52;--J:#2c3e50;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14101c;--panel:#1f1830;--ink:#f1e7d0}}
:root[data-theme="dark"]{--bg:#14101c;--panel:#1f1830;--ink:#f1e7d0}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#2b1d45 0,var(--bg) 60%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px 14px 32px}
h1{font-family:Creepster,Impact,"Arial Black",sans-serif;font-weight:400;font-size:clamp(2.2rem,9vw,3.6rem);margin:4px 0 2px;color:var(--pumpkin);letter-spacing:.04em;text-align:center}
.sub{margin:0 0 14px;color:var(--muted);text-align:center;font-size:.95rem}
.stage{position:relative;width:min(88vw,430px);aspect-ratio:1}
.pointer{position:absolute;left:50%;top:-6px;width:0;height:0;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--ink);z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
#wheel{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 6px #3a2a5c,0 0 40px rgba(255,122,26,.35);transition:transform 4.6s cubic-bezier(.1,.65,.08,1);cursor:pointer}
.hub{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:4px solid var(--ink);background:var(--bg);color:var(--pumpkin);font-family:Creepster,Impact,sans-serif;font-size:clamp(1.1rem,5vw,1.7rem);cursor:pointer;z-index:2}
.hub:disabled{opacity:.6;cursor:default}
.hub:focus-visible,#wheel:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.card{width:min(92vw,470px);margin-top:22px;min-height:190px;border-radius:18px;background:var(--panel);overflow:hidden;border:2px solid #3a2a5c;display:flex;flex-direction:column}
.card .head{padding:10px 16px;font-family:Creepster,Impact,sans-serif;font-size:1.5rem;letter-spacing:.05em;text-align:center;background:#3a2a5c}
.card .body{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 22px 24px;text-align:center;font-size:clamp(1.15rem,4.6vw,1.45rem);line-height:1.35}
.card.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin-top:16px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.tools{margin-top:14px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.85rem}
.tools button{background:none;border:1px solid #3a2a5c;color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){#wheel{transition-duration:.01s}.card.pop{animation:none}}

.teams{width:min(92vw,470px);margin-top:28px}
.teams h2{font-family:Creepster,Impact,sans-serif;font-weight:400;font-size:1.9rem;color:var(--pumpkin);margin:0 0 4px;letter-spacing:.04em}
.note{color:var(--muted);font-size:.85rem;margin:4px 0 10px;line-height:1.4}
.team{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid #3a2a5c;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.team .info{flex:1;min-width:0}
.team b{display:block;font-size:1.05rem}
.team small{display:block;color:var(--muted);overflow-wrap:anywhere}
.score{display:flex;align-items:center;gap:6px}
.score button,.team .x{width:36px;height:36px;border-radius:50%;border:2px solid #3a2a5c;background:var(--bg);color:var(--ink);font-size:1.2rem;cursor:pointer;padding:0}
.team .x{width:28px;height:28px;font-size:.9rem;color:var(--muted)}
.score output{min-width:2.2ch;text-align:center;font-family:Creepster,Impact,sans-serif;font-size:1.9rem;color:var(--pumpkin)}
.add{margin-top:14px;display:grid;gap:8px}
.add input,.add textarea{width:100%;background:var(--panel);color:var(--ink);border:2px solid #3a2a5c;border-radius:12px;padding:11px 12px;font:inherit;resize:vertical}
.add button,.teams details button{background:var(--pumpkin);color:#1b1024;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.teams details{margin-top:14px;color:var(--muted);font-size:.9rem}
.teams summary{cursor:pointer}
.teams details .add{margin-top:8px}
.add input:focus-visible,.add textarea:focus-visible,.add button:focus-visible,.score button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.add .ghost{background:none;color:var(--ink);border:2px solid #3a2a5c}
.bk h3{font-family:Creepster,Impact,sans-serif;font-weight:400;font-size:1.4rem;color:var(--pumpkin);margin:18px 0 6px;letter-spacing:.04em}
.match{background:var(--panel);border:2px solid #3a2a5c;border-radius:14px;padding:6px;margin-bottom:8px;display:grid;gap:6px}
.side{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:2px solid #3a2a5c;border-radius:10px;padding:12px;font:inherit;cursor:pointer}
.side.win{border-color:var(--pumpkin);background:#3b2410}
.side.lose{opacity:.45}
.side:disabled{cursor:default}
.side small{color:var(--muted)}
.side:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.champ{text-align:center;font-family:Creepster,Impact,sans-serif;font-size:2rem;color:var(--pumpkin);padding:14px;border:2px solid var(--pumpkin);border-radius:16px;margin:14px 0}
</style>
</head>
<body>
<h1 id="h1">La Ruota Maledetta</h1>
<p class="sub" id="sub">Beer Pong Maledetto: invece di bere, gira la ruota.</p>

<div class="stage">
  <div class="pointer"></div>
  <canvas id="wheel" width="720" height="720" tabindex="0" aria-label="Ruota delle penitenze, premi per girare"></canvas>
  <button class="hub" id="spin" type="button">GIRA</button>
</div>

<div class="card" id="card" aria-live="polite">
  <div class="head" id="head" style="background:#3a2a5c">Tocca a te</div>
  <div class="body" id="text">Premi GIRA e scopri cosa ti aspetta.</div>
</div>

<div class="legend">
  <span><i style="background:var(--P)"></i>Penitenza</span>
  <span><i style="background:var(--O)"></i>Obbligo di squadra</span>
  <span><i style="background:var(--R)"></i>Regola speciale</span>
  <span><i style="background:var(--J)"></i>Jolly</span>
</div>
<div class="tools"><span id="left"></span><button type="button" id="reset">Rimescola le carte</button></div>

<section class="teams">
  <h2>Squadre</h2>
  <p class="note" id="mode"></p>
  <div id="list"></div>
  <div class="add">
    <input id="tname" placeholder="Nome della squadra" maxlength="30" autocomplete="off">
    <textarea id="tmem" rows="2" placeholder="Membri (facoltativo), uno per riga"></textarea>
    <button type="button" id="tadd">Aggiungi squadra</button>
    <p class="note" id="tnote"></p>
  </div>
  <h2>Torneo</h2>
  <p class="note" id="tinfo">Servono almeno 2 squadre. Se sono dispari, qualcuna passa il turno senza giocare.</p>
  <div class="add">
    <button type="button" id="tbtn">Avvia torneo</button>
    <button type="button" id="tend" class="ghost" hidden>Chiudi il torneo</button>
  </div>
  <div class="bk" id="bracket"></div>
</section>

<script>
const CATS = {
  P:{n:"Penitenza",c:"#d35400",e:"🎭"},
  O:{n:"Obbligo di squadra",c:"#8e44ad",e:"🤝"},
  R:{n:"Regola speciale",c:"#1e9a52",e:"⚡"},
  J:{n:"Jolly",c:"#2c3e50",e:"🃏"}
};
const ORDER = ["P","O","R","J"];
const DATA = {
P:[
"Vai dalla squadra avversaria, annusa ognuno di loro e poi dì: “Comunque sono io il più profumato”, facendo suoni di scorregge nel frattempo.",
"tel|Fai un video con la tua squadra e mandalo alla mamma di un tuo compagno: silenzio per il primo secondo, poi tutti insieme “CIAO MAMMA!”.",
"mostro|Imita un mostro di Halloween finché non tocca di nuovo a te. Gli avversari devono indovinare quale.",
"teatro|Fai una dichiarazione d’amore drammatica a un oggetto della stanza scelto dagli avversari.",
"mostro|Fai l’ululato del lupo mannaro per 5 secondi, guardando il soffitto con la massima serietà.",
"Racconta una barzelletta. Se nessuno ride, ne racconti un’altra finché qualcuno ride.",
"Per i prossimi 2 turni parli solo in terza persona.",
"teatro|Fai una recensione seria e lusinghiera di un avversario, come fosse un ristorante a 3 stelle.",
"Sfila come un modello dell’orrore su una passerella immaginaria, commentato da un avversario.",
"tel|Chiama tua nonna o tua mamma in vivavoce e dille solo: “Ti voglio bene, sono diventato un vampiro”. Poi riattacca.",
"tel,risata|Manda un vocale di 5 secondi al tuo migliore amico che non è alla festa: solo una risata da strega, senza spiegazioni.",
"risata|Ridi in modo malvagio per 15 secondi senza fermarti. Se qualcuno ride con te, ricominci. Dopo 3 tentativi sei salvo.",
"teatro|Fai un discorso motivazionale di 30 secondi alla pallina da ping-pong: deve credere in sé stessa.",
"Vai da un avversario e sussurragli all’orecchio una frase inventata da te (almeno 10 parole). Deve passare di orecchio in orecchio a tutti i presenti tranne la tua squadra. L’ultimo la dice ad alta voce: si scopre cosa è uscito!",
"duello|Aura battle: sfida un avversario di qualsiasi squadra. Per 20 secondi sfidatevi a pose, sguardi ed entrate in scena: il pubblico vota chi ha più aura e chi perde perde 1 punto.",
"Imita con qualcuno a tua scelta il video di TikTok di AGS."],
O:[
"foto|Foto di squadra in posa da locandina di film horror. Vince l’espressione più terrorizzata.",
"foto|Foto di squadra in posizioni particolari: uno “morto” a terra, uno che lo piange, uno che scappa, uno con le mani nei capelli.",
"voce|Inventate e cantate un jingle della squadra di 10 secondi.",
"La squadra si tiene per mano per i prossimi 2 tiri.",
"voce|Inventate un grido di battaglia e urlatelo in faccia agli avversari.",
"mimo|Scegliete un compagno: fino a fine turno non può parlare e comunica solo a mimo.",
"foto|Selfie di squadra con le facce più spaventose possibili, da mandare nel gruppo.",
"parole|Raccontate una storia horror inventata, una parola a testa, per 1 minuto.",
"Tutta la squadra tira il prossimo colpo con la mano non dominante.",
"foto,voce|Video di squadra: tutti urlano “UN FANTASMA!” e scappano in direzioni diverse. Poi lo mandate nel gruppo della festa.",
"parole|La squadra conta fino a 20 ad alta voce, un numero a testa, a occhi chiusi e senza decidere prima l’ordine. Se due parlano insieme, si ricomincia (massimo 3 tentativi).",
"mimo|Specchio vivente: scegliete tra voi un “gemello”. Per 15 secondi tutti gli altri imitano simultaneamente ogni suo movimento. Se qualcuno ride, ricominciate (massimo 2 volte)."],
R:[
"Chi fa centro tira di nuovo.",
"Bicchiere maledetto: sposta uno dei bicchieri avversari dove vuoi.",
"tiro|Il prossimo tiro lo fai di spalle.",
"tiro|Il prossimo tiro lo fai a occhi chiusi.",
"tiro|Il prossimo tiro deve rimbalzare: se entra, la squadra avversaria toglie 2 bicchieri.",
"voce|La squadra avversaria deve cantare per tutto il turno successivo.",
"tiro|Scegli un avversario: al prossimo tiro deve tirare con la mano sinistra.",
"ride|Nessuno può ridere fino al prossimo tiro. Chi ride, gira la ruota.",
"tiro|Il prossimo tiro lo fai da seduto.",
"voce|Disturbo legale: durante il prossimo tiro avversario puoi fare versi spaventosi.",
"tiro|Il prossimo tiro avversario lo devono fare in ginocchio.",
"duello|Duello: scegli un avversario, il pubblico inventa una sfida buffa e la fate entrambi. Chi la fa peggio, votato dal pubblico, perde 1 punto."],
J:[
"evita|SALVO! Ignora la prossima penitenza che ti tocca.",
"evita|SPECCHIO! Giri la penitenza a chi vuoi.",
"RESURREZIONE! Rimetti sul tavolo un bicchiere già eliminato.",
"FANTASMA! Per un turno la tua squadra è invisibile: gli avversari non possono parlare.",
"Sfida di pollici con un avversario: chi perde gira la ruota.",
"punti|TESORO! La tua squadra guadagna 1 punto.",
"punti|RAPINA! Rubi 1 punto a una squadra a tua scelta."]
};

const SEG = 12, STEP = 360 / SEG;
const SEGCAT = ["P","O","R","P","J","O","P","R","O","P","R","J"];
const cv = document.getElementById("wheel"), ctx = cv.getContext("2d");
function draw(){
  const s = cv.width, r = s / 2;
  ctx.clearRect(0,0,s,s);
  for(let i=0;i<SEG;i++){
    const k = SEGCAT[i], a0 = (i*STEP-90)*Math.PI/180, a1 = ((i+1)*STEP-90)*Math.PI/180;
    ctx.beginPath(); ctx.moveTo(r,r); ctx.arc(r,r,r-4,a0,a1); ctx.closePath();
    ctx.fillStyle = CATS[k].c; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "#14101c"; ctx.stroke();
    ctx.save(); ctx.translate(r,r); ctx.rotate((a0+a1)/2);
    ctx.font = "54px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(CATS[k].e, r*0.72, 0); ctx.restore();
  }
}
draw();

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const parse = s => { const i = s.indexOf("|"); return i < 0 ? {t:s, g:[]} : {g:s.slice(0,i).split(","), t:s.slice(i+1)}; };
let decks = {}, rot = 0, busy = false, recent = [], lastCats = [], pending = null;
function count(){ document.getElementById("left").textContent = "Carte rimaste: " + ORDER.reduce((n,k) => n + decks[k].length, 0); }
function fill(){ ORDER.forEach(k => decks[k] = shuffle(DATA[k].map(parse))); recent = []; lastCats = []; count(); }
fill();
function pickCat(){
  const ks = ORDER.filter(k => !(lastCats.length === 2 && lastCats[0] === k && lastCats[1] === k));
  let r = Math.random() * ks.reduce((n,k) => n + DATA[k].length, 0);
  for (const k of ks) { r -= DATA[k].length; if (r < 0) return k; }
  return ks[0];
}
function nextCard(k){
  if (!decks[k].length) decks[k] = shuffle(DATA[k].map(parse));
  const d = decks[k], flat = recent.flat(); let idx = d.length - 1;
  for (let i = d.length - 1; i >= 0; i--) if (!d[i].g.some(x => flat.includes(x))) { idx = i; break; }
  const c = d.splice(idx, 1)[0];
  recent = recent.concat([c.g]).slice(-3);
  count(); return c.t;
}

const hub = document.getElementById("spin"), card = document.getElementById("card");
function spin(){
  if(busy) return; busy = true; hub.disabled = true;
  const k = pickCat(); lastCats = lastCats.concat(k).slice(-2);
  pending = {k, t: nextCard(k)};
  const segs = SEGCAT.map((c,i) => c === k ? i : -1).filter(i => i >= 0);
  const si = segs[Math.floor(Math.random()*segs.length)];
  const theta = si*STEP + STEP*(0.2 + Math.random()*0.6);
  const need = ((360 - theta) - (rot % 360) + 720) % 360;
  rot += 360 * (5 + Math.floor(Math.random()*3)) + need;
  cv.style.transform = "rotate(" + rot + "deg)";
  const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  setTimeout(land, reduce ? 50 : 4700);
}
function land(){
  const k = pending.k, head = document.getElementById("head");
  head.textContent = CATS[k].e + " " + CATS[k].n; head.style.background = CATS[k].c;
  document.getElementById("text").textContent = pending.t;
  card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
  try{ navigator.vibrate && navigator.vibrate(120); }catch(e){}
  busy = false; hub.disabled = false;
}
hub.addEventListener("click", spin);
cv.addEventListener("click", spin);
cv.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); spin(); } });
document.getElementById("reset").addEventListener("click", fill);
const $ = id => document.getElementById(id);
const LS = "ruota-squadre", LT = "ruota-torneo";
let teams = [], T = null;
try { teams = JSON.parse(localStorage.getItem(LS) || "[]"); } catch(e) { teams = []; }
try { T = JSON.parse(localStorage.getItem(LT) || "null"); } catch(e) { T = null; }
function save(){ try { localStorage.setItem(LS, JSON.stringify(teams)); localStorage.setItem(LT, JSON.stringify(T)); } catch(e) {} }
function note(t){ $("tnote").textContent = t; }
function mk(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function arm(btn, label, fn){
  const orig = btn.textContent; let timer = null;
  btn.addEventListener("click", () => {
    if (btn.dataset.armed) { clearTimeout(timer); delete btn.dataset.armed; btn.textContent = orig; fn(); return; }
    btn.dataset.armed = "1"; btn.textContent = label;
    timer = setTimeout(() => { delete btn.dataset.armed; btn.textContent = orig; }, 3000);
  });
}
function nameOf(id){ return (T && T.names[id]) || (teams.find(t => t.id === id) || {}).name || "?"; }

function renderTeams(){
  const list = $("list"); list.replaceChildren();
  $("mode").textContent = teams.length + (teams.length === 1 ? " squadra" : " squadre") + ". Salvate su questo telefono.";
  if (!teams.length) { list.append(mk("p","note","Nessuna squadra ancora. Aggiungine una qui sotto.")); return; }
  teams.slice().sort((a,b) => (b.score||0)-(a.score||0) || (a.ts||0)-(b.ts||0)).forEach(t => {
    const row = mk("div","team"), info = mk("div","info");
    info.append(mk("b",null,t.name));
    if ((t.members||[]).length) info.append(mk("small",null,t.members.join(", ")));
    const sc = mk("div","score"), minus = mk("button",null,"−"), out = mk("output",null,String(t.score||0)), plus = mk("button",null,"+");
    minus.type = plus.type = "button";
    minus.setAttribute("aria-label","Togli un punto a " + t.name); plus.setAttribute("aria-label","Dai un punto a " + t.name);
    minus.onclick = () => { t.score = (t.score||0) - 1; save(); renderTeams(); };
    plus.onclick = () => { t.score = (t.score||0) + 1; save(); renderTeams(); };
    sc.append(minus,out,plus);
    const x = mk("button","x","✕"); x.type = "button"; x.setAttribute("aria-label","Elimina " + t.name);
    arm(x, "Sicuro?", () => { teams = teams.filter(y => y !== t); save(); renderTeams(); renderT(); note(T ? "Squadra eliminata. Il torneo in corso resta com’è." : ""); });
    x.style.width = "auto"; x.style.padding = "0 8px";
    row.append(info,sc,x); list.append(row);
  });
}
$("tadd").onclick = () => {
  const name = $("tname").value.trim();
  const members = $("tmem").value.split(/[\n,]+/).map(x => x.trim()).filter(Boolean).slice(0,12);
  if (!name) { note("Scrivi il nome della squadra."); return; }
  if (teams.some(t => t.name.toLowerCase() === name.toLowerCase())) { note("Esiste già una squadra con questo nome."); return; }
  teams.push({id:"t" + Date.now() + Math.floor(Math.random()*1000), name, members, score:0, ts:Date.now()});
  save(); $("tname").value = ""; $("tmem").value = "";
  note(T ? "Squadra aggiunta. Per includerla nel torneo rifai il sorteggio." : "Squadra “" + name + "” aggiunta.");
  renderTeams(); $("tname").focus();
};
$("tname").addEventListener("keydown", e => { if (e.key === "Enter") $("tadd").click(); });

function seedOrder(size){ let o = [1]; while (o.length < size) { const n = []; o.forEach(s => n.push(s, o.length*2 + 1 - s)); o = n; } return o; }
function build(){
  const ids = T.seed; let size = 2; while (size < ids.length) size *= 2;
  const ord = seedOrder(size), rounds = []; let cur = [];
  for (let i = 0; i < size; i += 2) cur.push({a: ids[ord[i]-1] || null, b: ids[ord[i+1]-1] || null});
  for (let r = 0; ; r++) {
    cur.forEach((m,i) => {
      m.bye = r === 0 && (!!m.a !== !!m.b);
      m.w = m.bye ? (m.a || m.b) : null;
      const p = T.picks[r + "-" + i];
      if (!m.bye && p && (p === m.a || p === m.b)) m.w = p;
    });
    rounds.push(cur);
    if (cur.length === 1) break;
    const nx = []; for (let i = 0; i < cur.length; i += 2) nx.push({a: cur[i].w, b: cur[i+1].w});
    cur = nx;
  }
  return rounds;
}
function rname(r, total){ const k = total - 1 - r; return ["Finale","Semifinali","Quarti di finale","Ottavi di finale"][k] || "Turno " + (r+1); }
function pick(r, i, id){
  const key = r + "-" + i;
  if (T.picks[key] === id) delete T.picks[key]; else T.picks[key] = id;
  for (let rr = r + 1, j = Math.floor(i/2); ; rr++, j = Math.floor(j/2)) { delete T.picks[rr + "-" + j]; if (rr > 8) break; }
  save(); renderT();
}
function renderT(){
  const box = $("bracket"); box.replaceChildren();
  $("tend").hidden = !T;
  $("tbtn").textContent = T ? "Rifai il sorteggio" : "Avvia torneo";
  if (!T) return;
  const n = T.seed.length; let size = 2; while (size < n) size *= 2;
  const byes = size - n, rounds = build();
  $("tinfo").textContent = n + " squadre: " + (byes ? byes + (byes === 1 ? " passa direttamente" : " passano direttamente") + " al turno successivo (sorteggiate a caso)." : "tutte giocano dal primo turno.") + " Tocca la squadra che vince ogni partita.";
  const champ = rounds[rounds.length-1][0].w;
  if (champ) box.append(mk("div","champ","🏆 " + nameOf(champ)));
  rounds.forEach((ms, r) => {
    box.append(mk("h3",null,rname(r, rounds.length)));
    ms.forEach((m, i) => {
      const card = mk("div","match");
      if (m.bye) {
        const bt = mk("button","side win"); bt.disabled = true;
        bt.append(mk("span",null,nameOf(m.a || m.b)), mk("small",null,"passa il turno"));
        card.append(bt);
      } else {
        [m.a, m.b].forEach(id => {
          const bt = mk("button","side" + (m.w ? (m.w === id ? " win" : " lose") : "")); bt.type = "button";
          if (!id) { bt.disabled = true; bt.append(mk("span",null,"da definire")); }
          else { bt.append(mk("span",null,nameOf(id)), mk("small",null,m.w === id ? "vince" : "")); bt.onclick = () => pick(r, i, id); }
          card.append(bt);
        });
      }
      box.append(card);
    });
  });
}
$("tbtn").addEventListener("click", () => {
  if (teams.length < 2) { $("tinfo").textContent = "Servono almeno 2 squadre per avviare il torneo."; return; }
  if (T && !$("tbtn").dataset.armed) { $("tbtn").dataset.armed = "1"; $("tbtn").textContent = "Cancello i risultati: confermi?"; setTimeout(() => { delete $("tbtn").dataset.armed; renderT(); }, 3000); return; }
  delete $("tbtn").dataset.armed;
  T = {seed: shuffle(teams.map(t => t.id)), names: Object.fromEntries(teams.map(t => [t.id, t.name])), picks: {}};
  save(); renderT(); $("bracket").scrollIntoView({behavior:"smooth", block:"start"});
});
arm($("tend"), "Sicuro?", () => { T = null; save(); renderT(); $("tinfo").textContent = "Servono almeno 2 squadre. Se sono dispari, qualcuna passa il turno senza giocare."; });
renderTeams(); renderT();
</script>
</body>
</html>
